[package]
name = "rhaetree"
version = "1.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "rhaeTree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
phylotree = "0.1.3"
image = { version = "0.25", features = ["png", "jpeg"] }
svg = "0.18"
printpdf = { version = "0.7", features = ["embedded_images", "svg"] }
font-kit = "0.14"
tiny-skia = "0.11"
fontdue = "0.9"
cairo-rs = { version = "0.20", features = ["pdf"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = "0.2.2"
objc2-foundation = "0.2.2"
# Enable Metal backend for eframe's wgpu renderer on macOS.
wgpu = { version = "27", features = ["metal"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
